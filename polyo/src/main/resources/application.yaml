spring:
  application:
    name: polyo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/polyo}
    username: ${DB_USERNAME:polyo}
    password: ${DB_PASSWORD:polyo_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always

app:
  auth:
    jwt-secret: ${JWT_SECRET:polyo-development-secret-key-change-me-please}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
